name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pinned pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-py3.12-0.5.6-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run the same checks as local pre-commit, plus full-history secret scanning
        run: uvx --from prek==0.5.6 prek run --all-files --hook-stage manual --show-diff-on-failure

  library:
    name: Library tests and package artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true

      - name: Install development environment
        run: uv sync --locked

      - name: Run library tests
        run: uv run --no-sync --package forecasters pytest

      - name: Type-check the library
        run: uv run --no-sync --package forecasters mypy packages/forecasters/src packages/forecasters/tests/typing_consumer.py

      - name: Build the public package
        run: uv build --package forecasters --no-sources --out-dir dist/forecasters

      - name: Check that application code is excluded
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          artifacts = Path("dist/forecasters")
          with zipfile.ZipFile(next(artifacts.glob("*.whl"))) as wheel:
              names = wheel.namelist()
          with tarfile.open(next(artifacts.glob("*.tar.gz"))) as sdist:
              names += sdist.getnames()
          assert not any("forecasters_lineup" in name or "apps" in Path(name).parts for name in names)
          PY

      - name: Install and test each artifact in an isolated environment
        run: |
          set -euo pipefail
          for artifact in dist/forecasters/forecasters-*.whl dist/forecasters/forecasters-*.tar.gz; do
            envdir="$(mktemp -d)"
            uv venv --python 3.12 "$envdir"
            uv pip install --python "$envdir/bin/python" "$artifact" pytest
            "$envdir/bin/python" -c \
              "import importlib.resources as r; import forecasters; assert r.files('forecasters').joinpath('py.typed').is_file()"
            "$envdir/bin/python" -m pytest -q \
              packages/forecasters/tests/test_validation_numpy_only.py \
              packages/forecasters/tests/test_lazy_imports.py
          done
