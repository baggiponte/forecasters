name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Guard and build forecasters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.12"

      - name: Require a versioned tag reachable from main
        id: guard
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [ "$version" = "$tag" ] || [ -z "$version" ]; then
            echo "::error::Release tags must start with 'v' and include a version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag does not point at a commit reachable from origin/main"
            exit 1
          fi
          project_version="$(uv version --package forecasters --short)"
          if [ "$version" != "$project_version" ]; then
            echo "::error::Tag $tag does not match forecasters version $project_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build only the public package
        run: uv build --package forecasters --no-sources --out-dir dist/forecasters

      - name: Verify release artifact names
        env:
          RELEASE_VERSION: ${{ steps.guard.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          artifacts = Path("dist/forecasters")
          assert [path.name for path in artifacts.glob("forecasters-*.whl")] == [
              f"forecasters-{version}-py3-none-any.whl"
          ]
          assert [path.name for path in artifacts.glob("forecasters-*.tar.gz")] == [
              f"forecasters-{version}.tar.gz"
          ]
          print(f"validated forecasters {version} artifact names")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: forecasters-dist
          path: dist/forecasters/
          if-no-files-found: error

  publish:
    name: Publish forecasters to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing exchanges this OIDC token for a short-lived upload token.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: forecasters-dist
          path: dist/forecasters

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/forecasters/
