# Checker-only configuration for the experimental Pyrefly tensor-shape fixtures.
#
# This must run in the isolated `pyrefly` dependency group: the shape-aware NumPy/Torch
# stub packages overlay the real libraries and conflict with ty. `test_shapes.py` drives
# Pyrefly with this file, so every checker setting lives here rather than in Python.
#
# Paths are relative to this file. `project-includes` and `project-excludes` describe the
# project as a whole; the tests pass each fixture explicitly, so the positive and negative
# fixtures can share one configuration.
project-includes = ["fixtures/positive.py"]
project-excludes = ["fixtures/negative.py"]
search-path = ["stubs"]
python-version = "3.12"
python-platform = "linux"
preset = "default"
required-version = "==1.4.0"
