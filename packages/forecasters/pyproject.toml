[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[project]
name = "forecasters"
version = "0.1.0"
description = "A thin adapter layer over pretrained time-series foundation models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "array-api-compat>=1.9,<2", "typing-extensions>=4.10"]
authors = [{ name = "baggiponte" }]
keywords = ["time-series", "forecasting", "foundation-models", "quantiles"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
chronos = ["chronos-forecasting>=2.3,<3"]

[tool.ty.environment]
# Check against the oldest supported interpreter, not the development one.
python-version = "3.11"

[tool.ty.analysis]
# Native SDKs are optional extras; their imports are intentionally lazy and untyped here.
allowed-unresolved-imports = ["chronos", "timestral"]

[tool.ty.src]
# Library sources and the static consumer checks.
include = ["src", "tests/typing_consumer.py"]
