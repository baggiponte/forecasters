minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e  # v0.17.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
        stages: [pre-commit, manual]
      - id: ruff-format
        types_or: [python, pyi]
        stages: [pre-commit, manual]

  - repo: https://github.com/executablebooks/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547  # 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-frontmatter==2.1.2
          - mdformat-pyproject==0.1.1
        stages: [pre-commit, manual]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # v1.31.1
    hooks:
      - id: zizmor
        args: ["--no-progress", "--strict-collection", "--persona=pedantic", "--offline"]
        stages: [pre-commit, manual]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: dd409d04a3fa4a50f918dddb3ad3c6d8f46ab2cd  # 0.13.4
    hooks:
      - id: uv-lock
        args: ["--check"]
        files: (^|/)(uv\.lock|pyproject\.toml|uv\.toml)$
        stages: [pre-commit, manual]
      - id: uv-audit
        args: ["--locked", "--python-platform=x86_64-unknown-linux-gnu"]
        files: (^|/)(uv\.lock|pyproject\.toml|uv\.toml)$
        stages: [pre-commit, manual]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
        name: Detect staged hardcoded secrets
        stages: [pre-commit]
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in history
        entry: gitleaks git --redact --no-banner
        stages: [manual]
