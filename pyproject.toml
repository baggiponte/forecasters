[tool.uv.workspace]
members = ["packages/forecasters"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
forecasters = { workspace = true }
timestral = { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "pytest>=8.0",
  "mypy>=1.9",
  "torch>=2.3",
]
native = [
  "forecasters[chronos]",
  "timestral",
]



[tool.ruff]
src = ["packages/forecasters/src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.mdformat]
wrap = "no"
