[tool.uv.workspace]
members = ["packages/forecasters"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
forecasters = { workspace = true }
timestral = { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "pytest>=8.0",
  "torch>=2.3",
  "ty>=0.0.90",
]
native = [
  "forecasters[chronos]",
  "timestral",
]

[tool.pytest.ini_options]
testpaths = ["packages/forecasters/tests"]
addopts = "-q --strict-markers"
markers = [
  "native: requires downloaded native SDK checkpoints",
  "backend: requires the optional PyTorch test backend",
]

[tool.ruff]
src = ["packages/forecasters/src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "PYI", "TC", "RUF"]

[tool.mdformat]
wrap = "no"
